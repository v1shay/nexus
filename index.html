<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexus</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        text-align: center;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(3rem, 10vw, 7rem);
        font-weight: 600;
        letter-spacing: -0.06em;
      }

      p {
        margin-top: 0.75rem;
        color: #a3a3a3;
        font-size: clamp(1rem, 2vw, 1.25rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nexus</h1>
      <p>Your local super agent</p>
    </main>
  </body>
</html>
